name: Build

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main
      - '*'

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

permissions:
  contents: read

defaults:
    run:
        shell: bash {0}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Requirements
      run: |
        sudo apt-get install mingw-w64 markdown libfuse-dev

    - name: Checkout
      uses: actions/checkout@v5

    - name: Build Linux
      run: |
        sudo make -C build/unix unixpackage
      
    - name: Build Windows
      run: |
        sudo make -C build/unix winpackage

    - name: Results
      run: |
        [ -f build/unix/toolshed-*.tgz ] && ls build/unix/toolshed-*.tgz | xargs -I {} bash -c 'echo; md5sum {}; ls -al --color=auto {}; tar tzvf {}'
        [ -f build/unix/toolshed-*.zip ] && ls build/unix/toolshed-*.zip | xargs -I {} bash -c 'echo; md5sum {}; ls -al --color=auto {}; unzip -l -v {}'


    - name: Upload Linux package
      uses: actions/upload-artifact@v7
      with:
        name: toolshed-linux-x86_64
        path: build/unix/toolshed-unix64-*.tgz
        if-no-files-found: error

    - name: Upload Windows package
      uses: actions/upload-artifact@v7
      with:
        name: toolshed-windows-x86_64
        path: build/unix/toolshed-win64-*.zip
        if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Setup Requirements
      run: |
        brew install markdown

    - name: Checkout
      uses: actions/checkout@v5

    - name: Build macOS
      run: |
        set -e
        make -C build/unix NO_COCOFUSE=1 unixpackage
        for f in build/unix/toolshed-unix64-*.tgz; do
          mv "$f" "${f/unix64/macos-${{ matrix.arch }}}"
        done

    - name: Results
      run: |
        set -e
        for f in build/unix/toolshed-macos-*.tgz; do
          echo; shasum -a 256 "$f"; ls -al "$f"; tar tzvf "$f"
          tar xzf "$f" -O toolshed-*/os9 > os9-check
          test "$(lipo -archs os9-check)" = "${{ matrix.arch }}"
        done

    - name: Upload macOS package
      uses: actions/upload-artifact@v7
      with:
        name: toolshed-macos-${{ matrix.arch }}
        path: build/unix/toolshed-macos-*.tgz
        if-no-files-found: error
